<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horse Anatomy Memory Game</title>
    <style>
        body { background: #eaf6ff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #game-container {
            margin: 0 auto;
            display: block;
            width: 95vw;
            max-width: 400px;
            height: 65vw;
            max-height: 600px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            background: #f8f8f8;
            border-radius: 16px;
        }
        @media (max-width: 500px) {
            #game-container {
                max-width: 98vw;
                max-height: 80vw;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
