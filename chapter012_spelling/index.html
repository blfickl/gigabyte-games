<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Muscle Spelling Game</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #f0f8ff;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            touch-action: none;
            margin: 0;
            padding: 0;
            display: block;
            position: absolute;
            left: 0;
            top: 0;
        }
        #game-container canvas {
            display: block !important;
            margin: 0 !important;
            padding: 0 !important;
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
        }
    </style>
</head>

<body>
    <h1>Spelling Game: Muscles</h1>
    <div id="game-container"></div>
    <input id="mobile-input" type="text" style="position:absolute;top:-100px;opacity:0;width:1px;height:1px;"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <script src="src/scenes/Spelling.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
