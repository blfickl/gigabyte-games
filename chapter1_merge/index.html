<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Merge Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <style>
        body { margin: 0; background: #222; color: #fff; font-family: sans-serif; }
        #game-container { margin: 20px auto; display: block; width: 420px; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Ribbon Merge Game</h2>
    <div id="game-container"></div>
    <div id="arrow-controls" style="width: 400px; margin: 10px auto 0 auto; display: flex; flex-direction: column; align-items: center;">
        <div style="display: flex; justify-content: center;">
            <button class="arrow-btn" id="arrow-up" style="width:60px;height:60px;font-size:2em;margin:2px;">&#8593;</button>
        </div>
        <div style="display: flex; justify-content: center;">
            <button class="arrow-btn" id="arrow-left" style="width:60px;height:60px;font-size:2em;margin:2px;">&#8592;</button>
            <button class="arrow-btn" id="arrow-down" style="width:60px;height:60px;font-size:2em;margin:2px;">&#8595;</button>
            <button class="arrow-btn" id="arrow-right" style="width:60px;height:60px;font-size:2em;margin:2px;">&#8594;</button>
        </div>
    </div>
    <script src="src/main.js"></script>
</body>
</html>
